<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Your Midia List - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- MENU -->
    <nav class="menu">

        <a href="Home.html">
            <img src="img/logo.png" alt="Logo" width="50" class="logo">
        </a>

        <a href="Cadastro.html">
            <header>Cadastro</header>
        </a>

    </nav>

    <!-- LOGIN -->
    <div class="container login mt-5">

        <h2 class="mb-4">Login</h2>

        <form action="Home.html">

            <label for="email">Nome de usuário ou e-mail</label>
            <input type="text" id="email" name="email"
                placeholder="Digite seu usuário ou e-mail" required>

            <br><br>

            <label for="password">Senha de acesso:</label>
            <input type="password" id="password" name="password"
                placeholder="Digite sua senha" required>

            <br><br>

            <button type="submit">Entrar</button>

        </form>

        <br>

        <h5>Não possui uma conta?</h5>

        <a href="CadastroUsuario.html">Cadastre-se</a>

    </div>

</body>

</html>
