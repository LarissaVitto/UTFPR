<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Your Midia List - Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastroUsuario.css">
</head>

<body>

    <!-- MENU -->
    <nav class="menu">

        <a href="Home.html">
            <img src="img/logo.png" alt="Logo" width="50" class="logo">
        </a>

        <a href="Login.html">
            <header>Login</header>
        </a>

    </nav>

    <!-- CADASTRO -->
    <div class="container cadastro mt-5">

        <h2 class="mb-4">Cadastro</h2>

        <form action="Login.html">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                placeholder="Digite seu e-mail" required>

            <br><br>

            <label for="nomeUsuario">Nome de usuário</label>
            <input type="text" id="nomeUsuario" name="nomeUsuario"
                placeholder="Digite seu nome de usuário" required>

            <br><br>

            <label for="password">Senha de acesso:</label>
            <input type="password" id="password" name="password"
                placeholder="Digite sua senha" required>

            <br><br>

            <button type="submit">Cadastrar</button>

        </form>

        <br>

        <h5>Já possui uma conta?</h5>

        <a href="Login.html">Faça login</a>

    </div>

    <footer class="text-center mt-5 mb-3">
        <p>&copy; 2026 - Your Midia List</p>
    </footer>

</body>

</html>
